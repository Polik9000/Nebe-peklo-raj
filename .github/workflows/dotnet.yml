name: GPX parser tests

on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'data/**', '*.sln', '.github/workflows/dotnet.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'data/**', '*.sln', '.github/workflows/dotnet.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test NebePekloRaj.sln
